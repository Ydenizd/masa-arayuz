<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<!-- G3: yalnız kendi dosyaları; bağlantı yalnız GitHub API'ye. Satır içi betik ve stil yok. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src https://api.github.com; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<!-- G8 -->
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#071629">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Masa">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Masa</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="styles.css">
<script src="app.js" defer></script>
</head>
<body>
<noscript>Masa JavaScript gerektirir.</noscript>

<!-- Kurulum ve kilit ekranları -->
<section id="kapi" class="kapi" hidden>
  <div class="kapi-kutu">
    <div class="kicker">MASA</div>
    <h1 id="kapi-baslik">Kilitli</h1>
    <p id="kapi-aciklama" class="soluk"></p>

    <form id="kurulum" hidden autocomplete="off">
      <label>Masa deposu <span class="soluk">(sahip/depo)</span>
        <input id="k-repo" name="repo" required pattern="[A-Za-z0-9_.\-]+/[A-Za-z0-9_.\-]+" spellcheck="false" autocapitalize="off">
      </label>
      <label>Cihaz anahtarı <span class="soluk">(fine-grained token)</span>
        <input id="k-token" name="token" type="password" required spellcheck="false" autocapitalize="off">
      </label>
      <label>PIN <span class="soluk">(en az 6 hane; hiçbir yerde saklanmaz)</span>
        <input id="k-pin" name="pin" type="password" inputmode="numeric" required minlength="6">
      </label>
      <label>PIN (tekrar)
        <input id="k-pin2" name="pin2" type="password" inputmode="numeric" required minlength="6">
      </label>
      <button class="btn birincil" type="submit">Kaydet ve aç</button>
    </form>

    <form id="kilit" hidden autocomplete="off">
      <label>PIN
        <input id="l-pin" name="pin" type="password" inputmode="numeric" required>
      </label>
      <button class="btn birincil" type="submit">Aç</button>
      <button class="btn baglanti" type="button" id="anahtar-sil">Anahtarı bu cihazdan sil</button>
    </form>

    <p id="kapi-hata" class="hata" role="alert"></p>
  </div>
</section>

<!-- Masa -->
<main id="masa" hidden>
  <nav id="sekmeler" aria-label="Projeler"></nav>

  <header id="ust">
    <div class="marka">
      <h1 id="m-baslik"></h1>
      <p id="m-alt" class="soluk"></p>
    </div>
    <div class="bosluk"></div>
    <div class="grup" role="group" aria-label="Görünüm">
      <button class="btn" id="g-agac" type="button" aria-pressed="true">Ağaç</button>
      <button class="btn" id="g-pano" type="button" aria-pressed="false">Pano</button>
    </div>
    <button class="btn" id="son-degisiklikler" type="button">Son değişiklikler<span id="yeni-sayi" class="yeni-sayi"></span></button>
    <div id="katmanlar" aria-label="Katmanlar"></div>
    <div class="grup" role="group" aria-label="Yakınlaştırma">
      <button class="btn" id="z-eksi" type="button" aria-label="Uzaklaştır">−</button>
      <span class="btn yuzde" id="z-yuzde" role="status">100%</span>
      <button class="btn" id="z-arti" type="button" aria-label="Yakınlaştır">+</button>
      <button class="btn" id="z-sigdir" type="button">Sığdır</button>
    </div>
    <div class="dugmeler">
      <button class="btn" id="guncelle" type="button">Güncelle</button>
      <button class="btn" id="denetim" type="button" disabled title="Denetim yöntemi playbook hazır olunca kurulacak">Denetim</button>
      <button class="btn ikincil" id="kilitle" type="button" title="Anahtarı bellekten sil">Kilitle</button>
    </div>
    <div id="durum-satiri" class="soluk" role="status"></div>
  </header>

  <div id="tuval">
    <div id="sahne">
      <div id="agac" aria-label="Proje ağacı"></div>
      <div id="pano" aria-label="Kanban panosu" hidden></div>
    </div>
  </div>

  <div id="lejant" class="lejant" aria-label="Durum işaretleri">
    <span><i class="lj s-bitti">✓</i>bitti</span>
    <span><i class="lj s-suruyor">▶</i>sürüyor</span>
    <span><i class="lj s-engelli">■</i>engelli</span>
    <span><i class="lj s-bekliyor">○</i>bekliyor</span>
    <span><i class="lj s-yok">·</i>kayıt yok</span>
  </div>

  <aside id="panel" aria-live="polite"></aside>

  <!-- Lamba: dijital danışman (ADR-0026). Karakter app.js'de SVG olarak çizilir. -->
  <button id="lamba" type="button" aria-label="Lamba: danışman notları" aria-expanded="false" aria-controls="lamba-pencere"></button>
  <section id="lamba-pencere" aria-label="Lamba" aria-hidden="true">
    <header class="lamba-ust">
      <button class="btn" id="lamba-gizle" type="button" aria-label="Lambayı sağa kaydırıp kapat" title="Kapat">»</button>
      <div>
        <div class="kicker">LAMBA</div>
        <div id="lamba-alt" class="soluk"></div>
      </div>
    </header>
    <div id="lamba-icerik" aria-live="polite"></div>
    <div id="lamba-durum" class="soluk" role="status"></div>
    <div class="lamba-alt-satir">
      <div class="lamba-dugmeler">
        <button class="btn birincil" id="lamba-not" type="button">Ne durumdayız?</button>
        <button class="btn" id="lamba-kacir" type="button" title="Projede hiç konuşulmamış konuları arar (2–10 dakika)">Ne kaçırıyoruz? <span class="soluk">· 2–10 dk</span></button>
      </div>
      <form id="lamba-sor" autocomplete="off">
        <input id="ls-soru" type="text" placeholder="Lambaya sor" aria-label="Lambaya sor" maxlength="2000">
        <button class="btn" type="submit">Sor</button>
      </form>
    </div>
  </section>
</main>
</body>
</html>
